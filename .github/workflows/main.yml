name: pipeline for lambda-sample terraform

on:
  workflow_dispatch:
    inputs:
      terraform:
        type: boolean
        default: true
        description: 2.terraform
  push:
    branches:
      - main
    paths:
      - terraform/main/*
  pull_request:
    branches:
      - main
    paths:
      - terraform/main/*

env:
  TF_VERSION: 1.6.3
  AWS_REGION: ap-northeast-1

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: terraform/main
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@master
        with:
          role-to-assume: ${{ secrets.AWS_IAM_GITHUBACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
      - name: Terraform init
        id: init
        run: terraform init
      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OKMTDEV_GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outputs.stdout }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outputs.stdout }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outputs.stdout }}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform checks in directory '${{ matrix.directory }}'\n` + output
            })
      - name: Terraform apply
        if: ${{ github.event_name == 'push'}}
        run: terraform apply -auto-approve -no-color
